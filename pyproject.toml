[project]
name = "FluidTrack-Mini"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "libusb-package>=1.0.30.0",
    "pyownet>=0.10.0.post1",
    "pyserial>=3.5",
    "python-dotenv>=1.2.3",
    "pyusb>=1.3.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pyinstaller-hooks-contrib>=2026.8",
    "ruff>=0.16.10",
]


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
